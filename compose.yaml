name: directors-rag-handbook

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SOURCE_MANIFEST_PATH: /app/data/sources.yaml
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    networks: [rag-network]

  ui:
    build: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - src/directors_rag/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    env_file: .env
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks: [rag-network]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-directorsrag}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rag-network]

  qdrant:
    image: qdrant/qdrant:v1.15.3
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rag-network]

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [rag-network]

  ollama-pull:
    image: ollama/ollama:0.11.4
    profiles: [setup]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_CHAT_MODEL:-qwen2.5:3b}"]
    depends_on: [ollama]
    networks: [rag-network]

volumes:
  minio-data:
  qdrant-data:
  ollama-data:

networks:
  rag-network:
    driver: bridge
